<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArtistTickets — Country Music Tickets, Memberships & Meet & Greets</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- QRCode.js for real QR codes -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- Fonts & styles (unchanged) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* [All styles – exactly as in your provided code – unchanged for brevity] */
    /* ============================================================
       ArtistTickets — Single File SaaS Application
       1. Design tokens
       2. Base + layout
       3. Components (nav, cards, buttons, modals, forms, tables)
       4. Sections (landing, artist page, dashboards)
       5. Responsive
       ============================================================ */

    /* ---------- 1. Design tokens ---------- */
    :root {
      --bg: #08070b;
      --bg-2: #0e0d14;
      --surface: rgba(255, 255, 255, .045);
      --surface-2: rgba(255, 255, 255, .075);
      --stroke: rgba(255, 255, 255, .10);
      --stroke-strong: rgba(255, 255, 255, .18);
      --text: #f4f1ea;
      --muted: #a29d94;
      --amber: #e8b04b;
      --amber-2: #f6d896;
      --rust: #c0562f;
      --rust-2: #e2764a;
      --green: #4ec98a;
      --red: #e2564f;
      --grad-gold: linear-gradient(135deg, #f6d896 0%, #e8b04b 45%, #c0562f 100%);
      --grad-dusk: linear-gradient(140deg, #1a1220 0%, #2a1a1c 55%, #100d14 100%);
      --shadow: 0 24px 60px -24px rgba(0, 0, 0, .85);
      --shadow-gold: 0 18px 50px -18px rgba(232, 176, 75, .45);
      --r: 18px;
      --font: "Manrope", system-ui, -apple-system, Segoe UI, sans-serif;
      --display: "Bebas Neue", Impact, sans-serif;
    }

    /* ---------- 2. Base ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }
    html {
      scroll-behavior: smooth
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.55;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(70rem 40rem at 12% -10%, rgba(192, 86, 47, .28), transparent 60%),
        radial-gradient(60rem 40rem at 92% 8%, rgba(232, 176, 75, .18), transparent 60%),
        radial-gradient(50rem 40rem at 50% 110%, rgba(120, 60, 180, .14), transparent 60%),
        var(--bg);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .35;
      background-image: linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(70% 60% at 50% 20%, #000, transparent 85%);
    }
    img {
      max-width: 100%;
      display: block
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }
    a {
      color: inherit;
      text-decoration: none
    }
    ::selection {
      background: var(--amber);
      color: #140f08
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px
    }
    ::-webkit-scrollbar-track {
      background: #0b0a10
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2732;
      border-radius: 99px;
      border: 2px solid #0b0a10
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3d3949
    }

    .wrap {
      width: min(1240px, 92vw);
      margin-inline: auto
    }
    .stack {
      display: flex;
      flex-direction: column
    }
    .row {
      display: flex;
      align-items: center
    }
    .gap-8 {
      gap: 8px
    }
    .gap-12 {
      gap: 12px
    }
    .gap-16 {
      gap: 16px
    }
    .gap-24 {
      gap: 24px
    }
    .hidden {
      display: none !important
    }
    .muted {
      color: var(--muted)
    }
    .center {
      text-align: center
    }

    h1,
    h2,
    h3,
    .display {
      font-family: var(--display);
      letter-spacing: .02em;
      line-height: .98;
      font-weight: 400
    }
    h1 {
      font-size: clamp(2.9rem, 7vw, 5.4rem)
    }
    h2 {
      font-size: clamp(2rem, 4.4vw, 3.2rem)
    }
    h3 {
      font-size: clamp(1.3rem, 2.4vw, 1.75rem)
    }
    .eyebrow {
      font-size: .72rem;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 700;
    }
    .gold-text {
      background: var(--grad-gold);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    /* ---------- 3. Components ---------- */
    .glass {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow);
    }
    .glass-hover {
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .3s, box-shadow .35s
    }
    .glass-hover:hover {
      transform: translateY(-6px);
      border-color: var(--stroke-strong);
      box-shadow: var(--shadow-gold)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid var(--stroke-strong);
      background: var(--surface-2);
      cursor: pointer;
      font-weight: 700;
      font-size: .92rem;
      transition: transform .2s, background .25s, border-color .25s, box-shadow .3s;
      white-space: nowrap;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, .13)
    }
    .btn:active {
      transform: translateY(0)
    }
    .btn-primary {
      background: var(--grad-gold);
      color: #180f05;
      border-color: transparent;
      box-shadow: var(--shadow-gold)
    }
    .btn-primary:hover {
      background: var(--grad-gold);
      filter: brightness(1.07)
    }
    .btn-rust {
      background: linear-gradient(135deg, var(--rust-2), var(--rust));
      color: #fff;
      border-color: transparent
    }
    .btn-ghost {
      background: transparent
    }
    .btn-sm {
      padding: 8px 15px;
      font-size: .8rem
    }
    .btn-block {
      width: 100%
    }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      border: 1px solid var(--stroke-strong);
      background: var(--surface-2);
    }
    .badge-gold {
      background: rgba(232, 176, 75, .16);
      color: var(--amber-2);
      border-color: rgba(232, 176, 75, .35)
    }
    .badge-green {
      background: rgba(78, 201, 138, .14);
      color: var(--green);
      border-color: rgba(78, 201, 138, .32)
    }
    .badge-red {
      background: rgba(226, 86, 79, .14);
      color: #f19a95;
      border-color: rgba(226, 86, 79, .32)
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px
    }
    .field label {
      font-size: .76rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700
    }
    .input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 13px;
      border: 1px solid var(--stroke);
      background: rgba(0, 0, 0, .35);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 4px rgba(232, 176, 75, .13)
    }
    select.input {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
      background-size: 6px 6px;
      background-repeat: no-repeat
    }

    /* Navbar */
    .nav {
      position: sticky;
      top: 0;
      z-index: 80;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(8, 7, 11, .72);
      border-bottom: 1px solid var(--stroke);
    }
    .nav-in {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 72px
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--grad-gold);
      display: grid;
      place-items: center;
      color: #160e04;
      font-family: var(--display);
      font-size: 1.35rem;
      box-shadow: var(--shadow-gold);
    }
    .logo-txt {
      font-family: var(--display);
      font-size: 1.5rem;
      letter-spacing: .04em
    }
    .nav-links {
      display: flex;
      gap: 4px;
      margin-left: 14px
    }
    .nav-links a {
      padding: 9px 14px;
      border-radius: 999px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--muted);
      transition: color .2s, background .2s;
      cursor: pointer
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--surface-2)
    }
    .nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px
    }
    .burger {
      display: none;
      background: none;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--amber);
      cursor: pointer;
      background: var(--grad-dusk);
    }
    .avatar-fallback {
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: .85rem;
      color: var(--amber)
    }

    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      min-width: 230px;
      padding: 8px;
      z-index: 90;
    }
    .menu button {
      display: flex;
      width: 100%;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 11px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      text-align: left
    }
    .menu button:hover {
      background: var(--surface-2)
    }
    .menu .sep {
      height: 1px;
      background: var(--stroke);
      margin: 6px 4px
    }

    /* Toast */
    #toasts {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px
    }
    .toast {
      padding: 13px 17px;
      border-radius: 14px;
      min-width: 250px;
      max-width: 340px;
      font-size: .88rem;
      font-weight: 600;
      animation: slideIn .35s cubic-bezier(.2, .9, .25, 1);
    }
    .toast.ok {
      border-left: 3px solid var(--green)
    }
    .toast.err {
      border-left: 3px solid var(--red)
    }
    .toast.info {
      border-left: 3px solid var(--amber)
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(40px)
      }
      to {
        opacity: 1;
        transform: none
      }
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4, 3, 7, .76);
      backdrop-filter: blur(9px);
      animation: fadeIn .25s ease
    }
    @keyframes fadeIn {
      from {
        opacity: 0
      }
      to {
        opacity: 1
      }
    }
    .modal {
      width: min(620px, 100%);
      max-height: 88vh;
      overflow: auto;
      padding: 26px;
      animation: popIn .38s cubic-bezier(.2, .9, .25, 1);
      position: relative
    }
    .modal.wide {
      width: min(880px, 100%)
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.97)
      }
      to {
        opacity: 1;
        transform: none
      }
    }
    .modal-x {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--stroke);
      background: var(--surface-2);
      cursor: pointer;
      font-size: 1rem
    }
    .modal-x:hover {
      background: rgba(255, 255, 255, .14)
    }

    /* Loader */
    .loader-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      background: var(--grad-gold);
      z-index: 300;
      transition: width .3s ease, opacity .4s
    }
    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .14);
      border-top-color: var(--amber);
      animation: spin .7s linear infinite
    }
    @keyframes spin {
      to {
        transform: rotate(1turn)
      }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .12), rgba(255, 255, 255, .05));
      background-size: 200% 100%;
      animation: sh 1.2s infinite;
      border-radius: 12px
    }
    @keyframes sh {
      to {
        background-position: -200% 0
      }
    }

    /* Page transition */
    .page {
      animation: pageIn .45s cubic-bezier(.2, .8, .2, 1)
    }
    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(14px)
      }
      to {
        opacity: 1;
        transform: none
      }
    }

    /* Reveal on scroll */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1)
    }
    .reveal.in {
      opacity: 1;
      transform: none
    }

    /* Art (generated artwork placeholders) */
    .art {
      position: relative;
      overflow: hidden;
      background: var(--grad-dusk);
    }
    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(45% 60% at 25% 25%, var(--a1, rgba(232, 176, 75, .55)), transparent 65%),
        radial-gradient(55% 70% at 78% 70%, var(--a2, rgba(192, 86, 47, .6)), transparent 65%);
      filter: blur(6px)
    }
    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .5;
      background-image: repeating-linear-gradient(115deg, rgba(0, 0, 0, .35) 0 2px, transparent 2px 9px);
      mix-blend-mode: overlay
    }
    .art>* {
      position: relative;
      z-index: 2
    }
    .art-label {
      position: absolute;
      inset: auto 0 0 0;
      padding: 14px 16px;
      font-family: var(--display);
      font-size: 1.5rem;
      background: linear-gradient(transparent, rgba(4, 3, 6, .9))
    }

    /* Grids */
    .grid {
      display: grid;
      gap: 20px
    }
    .g3 {
      grid-template-columns: repeat(3, 1fr)
    }
    .g4 {
      grid-template-columns: repeat(4, 1fr)
    }
    .g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    /* Section */
    section.blk {
      padding: 86px 0
    }
    .sec-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 34px
    }
    .sec-head p {
      color: var(--muted);
      max-width: 56ch;
      margin-top: 8px
    }

    /* Hero */
    .hero {
      position: relative;
      padding: 96px 0 70px;
      overflow: hidden
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 44px;
      align-items: center
    }
    .hero h1 span {
      display: block
    }
    .hero p.lead {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 52ch;
      margin: 20px 0 28px
    }
    .stat-strip {
      display: flex;
      gap: 34px;
      margin-top: 44px;
      flex-wrap: wrap
    }
    .stat b {
      font-family: var(--display);
      font-size: 2.4rem;
      display: block;
      line-height: 1
    }
    .stat span {
      font-size: .74rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted)
    }
    .hero-card {
      padding: 22px;
      transform: rotate(1.2deg)
    }
    .ticket-stub {
      border-radius: 16px;
      padding: 18px;
      background: linear-gradient(150deg, rgba(232, 176, 75, .16), rgba(192, 86, 47, .12));
      border: 1px dashed rgba(232, 176, 75, .45);
      position: relative;
      overflow: hidden
    }
    .ticket-stub+.ticket-stub {
      margin-top: 12px
    }

    /* Search */
    .searchbox {
      position: relative;
      max-width: 560px
    }
    .searchbox .input {
      padding-left: 44px;
      height: 56px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .5)
    }
    .search-ico {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted)
    }
    .suggest {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 60;
      padding: 7px;
      max-height: 320px;
      overflow: auto
    }
    .suggest .item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer
    }
    .suggest .item:hover,
    .suggest .item.hl {
      background: var(--surface-2)
    }
    .suggest .thumb {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      flex: none
    }

    /* Artist page */
    .banner {
      height: 300px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      margin-top: 22px
    }
    .artist-head {
      display: flex;
      gap: 24px;
      align-items: flex-end;
      margin-top: -72px;
      padding: 0 26px;
      position: relative;
      z-index: 5
    }
    .artist-pic {
      width: 150px;
      height: 150px;
      border-radius: 26px;
      flex: none;
      border: 3px solid rgba(255, 255, 255, .25);
      box-shadow: var(--shadow)
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 7px;
      margin: 26px 0 30px;
      scrollbar-width: none
    }
    .tabs::-webkit-scrollbar {
      display: none
    }
    .tabs button {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 700;
      font-size: .88rem;
      color: var(--muted);
      white-space: nowrap;
      transition: .25s
    }
    .tabs button:hover {
      color: var(--text)
    }
    .tabs button.active {
      background: var(--grad-gold);
      color: #180f05
    }

    /* Event row */
    .event {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 20px;
      padding: 16px;
      align-items: center
    }
    .event .art {
      height: 104px;
      border-radius: 14px
    }
    .date-chip {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      flex: none;
      background: var(--surface-2);
      border: 1px solid var(--stroke);
      text-align: center;
      line-height: 1
    }
    .date-chip b {
      font-family: var(--display);
      font-size: 1.6rem;
      display: block
    }
    .date-chip span {
      font-size: .62rem;
      letter-spacing: .16em;
      color: var(--amber);
      text-transform: uppercase
    }

    /* Pricing / tiers */
    .tier {
      padding: 26px;
      position: relative;
      display: flex;
      flex-direction: column
    }
    .tier.featured {
      border-color: rgba(232, 176, 75, .5);
      box-shadow: var(--shadow-gold)
    }
    .tier .price {
      font-family: var(--display);
      font-size: 3rem;
      line-height: 1;
      margin: 14px 0 4px
    }
    .tier ul {
      list-style: none;
      margin: 18px 0 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1
    }
    .tier li {
      display: flex;
      gap: 10px;
      font-size: .9rem;
      color: #d9d4cb
    }
    .tier li::before {
      content: "✦";
      color: var(--amber)
    }
    .ribbon {
      position: absolute;
      top: 16px;
      right: 16px

    /* Qty */
    .qty {
      display: inline-flex;

      width: 44px;

      font-weight: 800
    }

    /* Gallery */
    .gal {
      columns: 3;
      column-gap: 16px
    }
    .gal .art {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: transform .35s
    }
    .gal .art:hover {
      transform: scale(1.02)
    }

    /* Testimonials */
    .quote {
      padding: 26px;
      font-size: .98rem
    }
    .quote .stars {
      color: var(--amber);

      margin-bottom: 12px
    }

    /* Dashboard */
    .dash {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 24px;
      padding: 26px 0 70px;
      align-items: start
    }
    .side {
      padding: 14px;
      position: sticky;
      top: 92px
    }
    .side h4 {
      font-size: .7rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 12px;
      font-family: var(--font);
      font-weight: 800
    }
    .side button {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 600;
      font-size: .89rem;
      color: var(--muted);
      text-align: left;
      transition: .2s
    }
    .side button:hover {
      background: var(--surface-2);
      color: var(--text)
    }
    .side button.active {
      background: var(--grad-gold);
      color: #180f05;
      font-weight: 800
    }
    .kpi {
      padding: 20px
    }
    .kpi .v {
      font-family: var(--display);
      font-size: 2.4rem;
      line-height: 1;
      margin: 6px 0
    }
    .kpi .l {
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted)
    }
    .kpi .d {
      font-size: .78rem;
      font-weight: 700;
      color: var(--green)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem
    }
    th {
      text-align: left;
      font-size: .68rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 14px;
      border-bottom: 1px solid var(--stroke);
      font-weight: 800
    }
    td {
      padding: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .055)
    }
    tbody tr {
      transition: background .2s
    }
    tbody tr:hover {
      background: var(--surface)
    }
    .table-wrap {
      overflow-x: auto
    }

    /* Charts */
    .chart {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 190px;
      padding-top: 12px
    }
    .chart .bar {
      flex: 1;
      border-radius: 9px 9px 4px 4px;
      background: var(--grad-gold);
      position: relative;
      animation: grow .9s cubic-bezier(.2, .9, .25, 1) both;
      min-height: 5px;
      opacity: .9
    }
    .chart .bar:hover {
      filter: brightness(1.15)
    }
    .chart .bar span {
      position: absolute;
      bottom: -22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: .66rem;
      color: var(--muted)
    }
    .chart .bar b {
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: .68rem;
      color: var(--amber-2)
    }
    @keyframes grow {
      from {
        height: 0
      }
    }
    .donut {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: none
    }
    .donut .hole {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #0c0b11;
      display: grid;
      place-items: center;
      text-align: center
    }
    .legend {
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: .84rem
    }
    .legend i {
      width: 11px;
      height: 11px;
      border-radius: 4px;
      display: inline-block;
      margin-right: 8px
    }
    .spark {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 44px
    }
    .spark i {
      flex: 1;
      background: rgba(232, 176, 75, .5);
      border-radius: 3px
    }

    /* QR */
    .qr-card {
      padding: 22px;
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
      border: 1px solid var(--stroke-strong);
      text-align: center
    }
    canvas.qr {
      background: #fff;
      border-radius: 14px;
      padding: 10px;
      width: 190px;
      height: 190px
    }
    .memcard {
      border-radius: 22px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(232, 176, 75, .22), rgba(192, 86, 47, .2)), #141019;
      border: 1px solid rgba(232, 176, 75, .4)
    }
    .memcard.silver {
      background: linear-gradient(135deg, rgba(200, 205, 215, .25), rgba(120, 125, 140, .2)), #141019;
      border-color: rgba(200, 205, 215, .4)
    }
    .memcard.platinum {
      background: linear-gradient(135deg, rgba(190, 160, 255, .25), rgba(90, 190, 230, .2)), #141019;
      border-color: rgba(190, 160, 255, .45)
    }
    .memcard .photo {
      width: 66px;
      height: 66px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, .4);
      background: var(--grad-dusk)
    }

    /* Payment */
    .paylist {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px
    }
    .pay {
      padding: 14px 12px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(0, 0, 0, .3);
      cursor: pointer;
      text-align: center;
      transition: .22s;
      font-size: .8rem;
      font-weight: 700
    }
    .pay:hover {
      border-color: var(--stroke-strong);
      transform: translateY(-2px)
    }
    .pay.sel {
      border-color: var(--amber);
      background: rgba(232, 176, 75, .12);
      box-shadow: 0 0 0 3px rgba(232, 176, 75, .12)
    }
    .pay .ic {
      font-size: 1.35rem;
      display: block;
      margin-bottom: 6px
    }
    .summary {
      padding: 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, .32);
      border: 1px solid var(--stroke)
    }
    .summary .line {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: .88rem;
      color: var(--muted)
    }
    .summary .total {
      display: flex;
      justify-content: space-between;
      padding-top: 11px;
      margin-top: 8px;
      border-top: 1px dashed var(--stroke-strong);
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--text)
    }
    .crypto-box {
      font-family: ui-monospace, Menlo, monospace;
      font-size: .76rem;
      word-break: break-all;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .45);
      border: 1px dashed var(--stroke-strong);
      color: var(--amber-2)
    }

    /* Scanner (removed) – kept only for reference */
    .scan-frame {
      height: 260px;
      border-radius: 20px;
      border: 1px solid var(--stroke);
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, rgba(232, 176, 75, .08), rgba(0, 0, 0, .5))
    }
    .scan-frame .line {
      position: absolute;
      left: 8%;
      right: 8%;
      height: 2px;
      background: var(--amber);
      box-shadow: 0 0 18px var(--amber);
      animation: scan 2.1s ease-in-out infinite
    }
    @keyframes scan {
      0%,
      100% {
        top: 12%
      }
      50% {
        top: 86%
      }
    }
    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 3px solid var(--amber)
    }
    .c1 {
      top: 16px;
      left: 16px;
      border-right: 0;
      border-bottom: 0;
      border-radius: 10px 0 0 0
    }
    .c2 {
      top: 16px;
      right: 16px;
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 10px 0 0
    }
    .c3 {
      bottom: 16px;
      left: 16px;
      border-right: 0;
      border-top: 0;
      border-radius: 0 0 0 10px
    }
    .c4 {
      bottom: 16px;
      right: 16px;
      border-left: 0;
      border-top: 0;
      border-radius: 0 0 10px 0
    }
    .verdict {
      padding: 22px;
      border-radius: 18px;
      text-align: center;
      font-family: var(--display);
      font-size: 2rem
    }
    .v-ok {
      background: rgba(78, 201, 138, .14);
      border: 1px solid rgba(78, 201, 138, .4);
      color: #88e7b6
    }
    .v-used {
      background: rgba(232, 176, 75, .14);
      border: 1px solid rgba(232, 176, 75, .4);
      color: var(--amber-2)
    }
    .v-bad {
      background: rgba(226, 86, 79, .14);
      border: 1px solid rgba(226, 86, 79, .4);
      color: #f19a95
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--stroke);
      padding: 56px 0 34px;
      margin-top: 40px;
      background: rgba(0, 0, 0, .3)
    }
    .foot-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 30px
    }
    footer a {
      display: block;
      color: var(--muted);
      font-size: .88rem;
      padding: 5px 0;
      transition: color .2s
    }
    footer a:hover {
      color: var(--amber)
    }
    .foot-bottom {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--stroke);
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      font-size: .82rem;
      color: var(--muted)
    }

    /* Marquee */
    .marquee {
      overflow: hidden;
      border-block: 1px solid var(--stroke);
      background: rgba(0, 0, 0, .25);
      padding: 12px 0
    }
    .marquee div {
      display: flex;
      gap: 44px;
      width: max-content;
      animation: mq 26s linear infinite;
      font-family: var(--display);
      font-size: 1.3rem;
      color: var(--muted)
    }
    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    /* 5. Responsive */
    @media(max-width:1024px) {
      .g4 {
        grid-template-columns: repeat(2, 1fr)
      }
      .hero-grid {
        grid-template-columns: 1fr
      }
      .dash {
        grid-template-columns: 1fr
      }
      .side {
        position: static;
        display: flex;
        gap: 6px;
        overflow-x: auto
      }
      .side h4 {
        display: none
      }
      .side button {
        width: auto;
        white-space: nowrap
      }
      .gal {
        columns: 2
      }
    }
    @media(max-width:760px) {
      .nav-links {
        display: none
      }
      .burger {
        display: block
      }
      .g3,
      .g4,
      .g2 {
        grid-template-columns: 1fr
      }
      .foot-grid {
        grid-template-columns: 1fr 1fr
      }
      .event {
        grid-template-columns: 1fr;
        gap: 14px
      }
      .event .art {
        height: 150px
      }
      .artist-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        margin-top: -56px
      }
      .artist-pic {
        width: 112px;
        height: 112px
      }
      .banner {
        height: 210px
      }
      .paylist {
        grid-template-columns: repeat(2, 1fr)
      }
      .gal {
        columns: 1
      }
      section.blk {
        padding: 60px 0
      }
      .stat-strip {
        gap: 22px
      }
      .mobile-menu {
        display: block
      }
    }
  </style>
</head>
<body>
  <div class="loader-bar" id="loaderBar"></div>

  <!-- ===== NAVBAR ===== -->
  <nav class="nav">
    <div class="wrap nav-in">
      <div class="logo" onclick="go('/')">
        <div class="logo-mark">AT</div>
        <div class="logo-txt">Artist<span class="gold-text">Tickets</span></div>
      </div>
      <div class="nav-links" id="navLinks">
        <a onclick="go('/')">Home</a>
        <a onclick="go('/artists')">Artists</a>
        <a onclick="go('/events')">Events</a>
        <a onclick="go('/memberships')">Memberships</a>
      </div>
      <div class="nav-right">
        <div id="authArea" style="position:relative"></div>
        <button class="burger" onclick="toggleMobileNav()">☰</button>
      </div>
    </div>
    <div id="mobileNav" class="hidden" style="border-top:1px solid var(--stroke);padding:10px 4vw 16px">
      <div class="stack gap-8">
        <a class="btn btn-ghost btn-block" onclick="go('/');toggleMobileNav()">Home</a>
        <a class="btn btn-ghost btn-block" onclick="go('/artists');toggleMobileNav()">Artists</a>
        <a class="btn btn-ghost btn-block" onclick="go('/events');toggleMobileNav()">Events</a>
        <a class="btn btn-ghost btn-block" onclick="go('/memberships');toggleMobileNav()">Memberships</a>
        <a class="btn btn-primary btn-block" onclick="go('/dashboard');toggleMobileNav()">My Dashboard</a>
      </div>
    </div>
  </nav>

  <main id="app"></main>
  <div id="modalRoot"></div>
  <div id="toasts"></div>

  <script>
    /* ============================================================
       ArtistTickets — Firebase Integration with QR & Admin Confirm
       ============================================================ */

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDqnRzf-GJYwYIdfJ81KPVUQpdkErdFn4I",
      authDomain: "artisttickets-42807.firebaseapp.com",
      projectId: "artisttickets-42807",
      storageBucket: "artisttickets-42807.firebasestorage.app",
      messagingSenderId: "523932392914",
      appId: "1:523932392914:web:cdcd6a17d84edd9505bc0b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.enablePersistence().catch(() => {});

    // ---------- Helpers ----------
    const money = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
    const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const dayOf = d => new Date(d + 'T12:00:00').getDate();
    const monOf = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short' });
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const rand = n => Math.floor(Math.random() * n);
    const newId = () => 'ORD-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    const newCode = () => 'AT' + Math.random().toString(36).slice(2, 12).toUpperCase();

    function toast(msg, kind = 'ok') {
      const el = document.createElement('div');
      el.className = 'toast glass ' + kind;
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0';
        el.style.transform = 'translateX(30px)';
        el.style.transition = '.4s';
        setTimeout(() => el.remove(), 400) }, 3400);
    }

    function progress() {
      const b = document.getElementById('loaderBar');
      b.style.opacity = '1';
      b.style.width = '18%';
      setTimeout(() => b.style.width = '72%', 90);
      setTimeout(() => { b.style.width = '100%';
        setTimeout(() => { b.style.opacity = '0';
          b.style.width = '0' }, 320) }, 280);
    }

    // ---- QR with QRCode.js ----
    function qrHTML(data) {
      return `<canvas class="qr" width="200" height="200" data-qr="${esc(data)}"></canvas>`;
    }

    function paintQRs(scope) {
      (scope || document).querySelectorAll('canvas[data-qr]').forEach(c => {
        const text = c.dataset.qr;
        new QRCode(c, {
          text: text,
          width: c.width,
          height: c.height,
          colorDark: "#0a0810",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    }

    function downloadQR(code) {
      const c = document.createElement('canvas');
      c.width = 400;
      c.height = 400;
      new QRCode(c, {
        text: window.location.origin + window.location.pathname + '#/ticket/' + code,
        width: 400,
        height: 400,
        colorDark: "#0a0810",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      const a = document.createElement('a');
      a.download = code + '.png';
      a.href = c.toDataURL('image/png');
      a.click();
      toast('Pass downloaded as PNG', 'ok');
    }

    // Art helper
    function art(cls, a1, a2, label, style) {
      return `<div class="art ${cls||''}" style="${style||''};--a1:${a1};--a2:${a2}">${label?`<div class="art-label">${esc(label)}</div>`:''}</div>`;
    }

    function avatarHTML(u, size = 38) {
      if (u && u.photo) return `<img class="avatar" style="width:${size}px;height:${size}px" src="${u.photo}" alt="${esc(u.name)}">`;
      return `<div class="avatar avatar-fallback" style="width:${size}px;height:${size}px">${u?initials(u.name):'?'}</div>`;
    }

    // Modal
    function modal(html, wide) {
      const root = document.getElementById('modalRoot');
      root.innerHTML =
        `<div class="overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal glass ${wide?'wide':''}">
          <button class="modal-x" onclick="closeModal()">✕</button>${html}
        </div></div>`;
      paintQRs(root);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() { document.getElementById('modalRoot').innerHTML = '';
      document.body.style.overflow = '' }

    // ---------- Global state ----------
    let currentUser = null;
    let currentUserData = null;
    let currentRole = 'customer';
    let CART = null,
      payMethod = 'Credit Card';
    let artistTab = 'home',
      dashTab = null;
    let currentArtistId = null;
    let purchasesUnsubscribe = null;

    // ---------- Firebase Auth ----------
    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          if (doc.exists) {
            currentUserData = doc.data();
            currentRole = currentUserData.role || 'customer';
          } else {
            const newUser = {
              name: user.displayName || user.email || 'Fan',
              email: user.email,
              role: 'customer',
              joined: new Date().toISOString().slice(0, 10),
              spend: 0,
              photo: null,
              phone: ''
            };
            await db.collection('users').doc(user.uid).set(newUser);
            currentUserData = newUser;
            currentRole = 'customer';
          }
        } catch (e) {
          toast('Error loading profile', 'err');
          console.error(e);
        }
        renderAuth();
        if (location.hash === '#/dashboard') go('/dashboard');
        else route();
        if (currentRole === 'admin') {
          if (purchasesUnsubscribe) purchasesUnsubscribe();
          purchasesUnsubscribe = db.collection('purchases').orderBy('date', 'desc').onSnapshot(snapshot => {
            if (dashTab && document.getElementById('dashBody')) {
              setDash(dashTab);
            }
          }, err => console.error(err));
        }
      } else {
        currentUser = null;
        currentUserData = null;
        currentRole = 'customer';
        if (purchasesUnsubscribe) { purchasesUnsubscribe();
          purchasesUnsubscribe = null; }
        renderAuth();
        if (location.hash === '#/dashboard') go('/');
        route();
      }
    });

    // ---------- Auth UI ----------
    function renderAuth() {
      const el = document.getElementById('authArea');
      if (!currentUser) {
        el.innerHTML =
          `<button class="btn btn-primary btn-sm" onclick="openSignIn()">Sign in</button>`;
        return;
      }
      const u = currentUserData || { name: currentUser.displayName || 'User', email: currentUser.email };
      el.innerHTML = `<div onclick="toggleMenu(event)" style="cursor:pointer">${avatarHTML(u,38)}</div>
        <div id="userMenu" class="menu glass hidden">
          <div style="padding:10px 12px"><b style="display:block;font-size:.9rem">${esc(u.name)}</b>
            <span class="muted" style="font-size:.76rem">${esc(u.email)}</span>
            <span class="badge badge-gold" style="margin-top:6px">${currentRole}</span>
          </div>
          <div class="sep"></div>
          <button onclick="closeMenu();go('/dashboard')">🎫 My dashboard</button>
          <button onclick="closeMenu();go('/events')">📅 Browse events</button>
          <div class="sep"></div>
          <button onclick="closeMenu();signOut()">⎋ Sign out</button>
        </div>`;
    }

    function toggleMenu(e) { e.stopPropagation();
      document.getElementById('userMenu').classList.toggle('hidden') }

    function closeMenu() { const m = document.getElementById('userMenu'); if (m) m.classList.add('hidden') }
    document.addEventListener('click', e => {
      if (!e.target.closest('#authArea')) closeMenu();
      if (!e.target.closest('.searchbox')) { const s = document.getElementById('suggestBox'); if (s) s.classList.add('hidden') }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal();
        closeMenu() } });

    // ---------- Sign In / Sign Up ----------
    function openSignIn() {
      modal(`
        <div class="eyebrow">Sign in</div>

    async function confirmPay(total) {
      const btn = document.getElementById('payBtn');
      btn.disabled = true;
      btn.innerHTML =
      '<span class="spinner" style="width:18px;height:18px;border-width:2px"></span> Processing payment…';
      setTimeout(async () => {
        const rec = {
          ...CART,
          id: newId(),
          code: newCode(),
          userId: currentUser.uid,
          method: payMethod,
          date: new Date().toISOString().slice(0, 10),
          used: false,
          amount: total,
          status: 'pending'  // <-- new: pending confirmation
        };
        try {
          await db.collection('purchases').add(rec);
          await db.collection('users').doc(currentUser.uid).update({
            spend: firebase.firestore.FieldValue.increment(total)
          });
          if (rec.kind === 'ticket' && rec.eventId) {
            const evRef = db.collection('events').doc(rec.eventId);
            await evRef.update({
              sold: firebase.firestore.FieldValue.increment(rec.qty)
            });

          await db.collection('notifications').add({
            userId: currentUser.uid,
            title: 'Payment pending',
            body: 'Your purchase for ' + rec.label + ' is awaiting admin confirmation.',

    function passCard(p) {
      const a = getArtistById(p.artistId);
      const e = p.eventId ? getEventById(p.eventId) : null;
      const isConfirmed = p.status === 'confirmed';
      return `<div class="glass glass-hover" style="padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center">
        <div style="position:relative">
          ${isConfirmed ? qrHTML(p.code) : `<div style="width:82px;height:82px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:.8rem">⏳ Pending</div>`}
        </div>
        <div style="min-width:0">
          <div class="row gap-8" style="flex-wrap:wrap"><b>${esc(p.label)}</b>
          ${isConfirmed ? '<span class="badge badge-green">Valid</span>' : '<span class="badge badge-gold">Pending</span>'}</div>
          <div class="muted" style="font-size:.84rem">${esc(p.sub||'')}${e?' · '+esc(e.venue):''}</div>
          <div class="muted" style="font-size:.78rem;margin-top:3px">${esc(p.id)} · ${esc(a?a.name:'')} · ${fmtDate(p.date)}</div>
        </div>
        <div class="stack gap-8">
          <button class="btn btn-sm" onclick="viewPass('${p.id}')">View</button>
          ${isConfirmed ? `<button class="btn btn-sm btn-primary" onclick="downloadQR('${p.code}')">⬇ Save</button>` : ''}
        </div>
      </div>`;
    }

    function viewPass(id) {
      db.collection('purchases').doc(id).get().then(doc => {
        if (doc.exists) showTicketDetails({ id: doc.id, ...doc.data() });
        else toast('Pass not found', 'err');
      });
    }

    function showTicketDetails(p) {
      const isConfirmed = p.status === 'confirmed';
      modal(`<div class="center">
        <h3 style="font-size:2rem">${esc(p.label)}</h3>
        <p class="muted">${esc(p.sub||'')}</p>
        <div style="margin:16px 0">
          <span class="badge ${isConfirmed?'badge-green':'badge-gold'}">${isConfirmed?'✓ Confirmed':'⏳ Pending'}</span>
        </div>
        ${isConfirmed ? `<div style="display:flex;justify-content:center">${qrHTML(p.code)}</div>` : '<p class="muted">QR code will appear once admin confirms your purchase.</p>'}
        <div class="summary" style="text-align:left;margin-top:10px">
          <div class="line"><span>Order ID</span><b>${esc(p.id)}</b></div>
          <div class="line"><span>Amount</span><b>${money(p.amount)}</b></div>
          <div class="line"><span>Paid with</span><b>${esc(p.method)}</b></div>
          <div class="line"><span>Date</span><b>${fmtDate(p.date)}</b></div>
        </div>
        <button class="btn btn-primary" style="margin-top:18px" onclick="closeModal()">Close</button>
      </div>`, true);
    }

    function empty(msg, cta, action) {
      return `<div class="glass center" style="padding:52px 22px"><div style="font-size:2rem">🎫</div>
        <h3 style="margin:12px 0 8px">${esc(msg)}</h3>
        <p class="muted" style="margin-bottom:18px">Everything you purchase lands here instantly with its QR pass.</p>
        ${cta?`<button class="btn btn-primary" onclick="${action}">${esc(cta)}</button>`:''}</div>`;
    }

    function head(title, sub, actions) {
      return `<div class="row" style="justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px">
        <div><span class="eyebrow">${esc(dashTab)}</span><h3 style="margin-top:6px">${esc(title)}</h3>
        ${sub?`<p class="muted" style="font-size:.88rem">${esc(sub)}</p>`:''}</div>${actions||''}</div>`;
    }

    function kpi(label, value, delta) {
      return `<div class="glass kpi glass-hover"><div class="l">${esc(label)}</div><div class="v gold-text">${value}</div>
      ${delta?`<div class="d">${esc(delta)}</div>`:''}</div>`;
    }

    function barChart(data, labels) {
      const max = Math.max(...data);
      return `<div class="chart">${data.map((d,i)=>`<div class="bar" style="height:${Math.round(d/max*100)}%;animation-delay:${i*45}ms">
        <b>${compact(d*1000)}</b><span>${labels[i]}</span></div>`).join('')}</div><div style="height:22px"></div>`;
    }

    function donut(parts) {
      const total = parts.reduce((s, p) => s + p.v, 0);
      let acc = 0;
      const stops = parts.map(p => { const a = acc / total * 360,
          b = (acc + p.v) / total * 360;
        acc += p.v; return `${p.c} ${a}deg ${b}deg` }).join(',');
      return `<div class="row gap-24" style="flex-wrap:wrap">
        <div class="donut" style="background:conic-gradient(${stops})"><div class="hole"><div>
          <div class="display" style="font-size:1.5rem">${compact(total)}</div><div class="muted" style="font-size:.64rem;letter-spacing:.16em">TOTAL</div></div></div></div>
        <div class="legend">${parts.map(p=>`<div><i style="background:${p.c}"></i>${esc(p.k)} — <b>${compact(p.v)}</b></div>`).join('')}</div></div>`;
    }

              </tbody></table></div></div>`
              : `<div class="glass center" style="padding:52px"><h3>All clear</h3><p class="muted">No pending purchases waiting for confirmation.</p></div>`);
        }

        // ... other admin tabs (Users, Artists, Events, Payments, Analytics, Support, System Settings) unchanged
        // For brevity, I'll include them in the final code.
        default:

              </div>
              <div class="glass" style="padding:24px"><span class="eyebrow">Feature flags</span>
                <div class="stack gap-8" style="margin-top:14px">
                ${['Face-photo gate verification','Crypto checkout','Membership auto-renew','Resale marketplace','Dynamic pricing'].map((f,i)=>`
                  <div class="row" style="justify-content:space-between;padding:11px 13px;border-radius:12px;background:var(--surface)">
                    <span style="font-size:.88rem">${f}</span>
                    <span class="badge ${i===4?'badge-red':'badge-green'}">${i===4?'Disabled':'Enabled'}</span></div>`).join('')}
