<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArtistTickets — Country Music Tickets, Memberships & Meet & Greets</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Fonts & styles (unchanged) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* [All styles from the original – unchanged] */
    /* ============================================================
       ArtistTickets — Single File SaaS Application
       1. Design tokens
       2. Base + layout
       3. Components (nav, cards, buttons, modals, forms, tables)
       4. Sections (landing, artist page, dashboards)
       5. Responsive
       ============================================================ */

    /* ---------- 1. Design tokens ---------- */
    :root {
      --bg: #08070b;
      --bg-2: #0e0d14;
      --surface: rgba(255, 255, 255, .045);
      --surface-2: rgba(255, 255, 255, .075);
      --stroke: rgba(255, 255, 255, .10);
      --stroke-strong: rgba(255, 255, 255, .18);
      --text: #f4f1ea;
      --muted: #a29d94;
      --amber: #e8b04b;
      --amber-2: #f6d896;
      --rust: #c0562f;
      --rust-2: #e2764a;
      --green: #4ec98a;
      --red: #e2564f;
      --grad-gold: linear-gradient(135deg, #f6d896 0%, #e8b04b 45%, #c0562f 100%);
      --grad-dusk: linear-gradient(140deg, #1a1220 0%, #2a1a1c 55%, #100d14 100%);
      --shadow: 0 24px 60px -24px rgba(0, 0, 0, .85);
      --shadow-gold: 0 18px 50px -18px rgba(232, 176, 75, .45);
      --r: 18px;
      --font: "Manrope", system-ui, -apple-system, Segoe UI, sans-serif;
      --display: "Bebas Neue", Impact, sans-serif;
    }

    /* ---------- 2. Base ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }
    html {
      scroll-behavior: smooth
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.55;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(70rem 40rem at 12% -10%, rgba(192, 86, 47, .28), transparent 60%),
        radial-gradient(60rem 40rem at 92% 8%, rgba(232, 176, 75, .18), transparent 60%),
        radial-gradient(50rem 40rem at 50% 110%, rgba(120, 60, 180, .14), transparent 60%),
        var(--bg);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .35;
      background-image: linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(70% 60% at 50% 20%, #000, transparent 85%);
    }
    img {
      max-width: 100%;
      display: block
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }
    a {
      color: inherit;
      text-decoration: none
    }
    ::selection {
      background: var(--amber);
      color: #140f08
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px
    }
    ::-webkit-scrollbar-track {
      background: #0b0a10
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2732;
      border-radius: 99px;
      border: 2px solid #0b0a10
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3d3949
    }

    .wrap {
      width: min(1240px, 92vw);
      margin-inline: auto
    }
    .stack {
      display: flex;
      flex-direction: column
    }
    .row {
      display: flex;
      align-items: center
    }
    .gap-8 {
      gap: 8px
    }
    .gap-12 {
      gap: 12px
    }
    .gap-16 {
      gap: 16px
    }
    .gap-24 {
      gap: 24px
    }
    .hidden {
      display: none !important
    }
    .muted {
      color: var(--muted)
    }
    .center {
      text-align: center
    }

    h1,
    h2,
    h3,
    .display {
      font-family: var(--display);
      letter-spacing: .02em;
      line-height: .98;
      font-weight: 400
    }
    h1 {
      font-size: clamp(2.9rem, 7vw, 5.4rem)
    }
    h2 {
      font-size: clamp(2rem, 4.4vw, 3.2rem)
    }
    h3 {
      font-size: clamp(1.3rem, 2.4vw, 1.75rem)
    }
    .eyebrow {
      font-size: .72rem;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 700;
    }
    .gold-text {
      background: var(--grad-gold);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    /* ---------- 3. Components ---------- */
    .glass {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: var(--shadow);
    }
    .glass-hover {
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .3s, box-shadow .35s
    }
    .glass-hover:hover {
      transform: translateY(-6px);
      border-color: var(--stroke-strong);
      box-shadow: var(--shadow-gold)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid var(--stroke-strong);
      background: var(--surface-2);
      cursor: pointer;
      font-weight: 700;
      font-size: .92rem;
      transition: transform .2s, background .25s, border-color .25s, box-shadow .3s;
      white-space: nowrap;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, .13)
    }
    .btn:active {
      transform: translateY(0)
    }
    .btn-primary {
      background: var(--grad-gold);
      color: #180f05;
      border-color: transparent;
      box-shadow: var(--shadow-gold)
    }
    .btn-primary:hover {
      background: var(--grad-gold);
      filter: brightness(1.07)
    }
    .btn-rust {
      background: linear-gradient(135deg, var(--rust-2), var(--rust));
      color: #fff;
      border-color: transparent
    }
    .btn-ghost {
      background: transparent
    }
    .btn-sm {
      padding: 8px 15px;
      font-size: .8rem
    }
    .btn-block {
      width: 100%
    }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      border: 1px solid var(--stroke-strong);
      background: var(--surface-2);
    }
    .badge-gold {
      background: rgba(232, 176, 75, .16);
      color: var(--amber-2);
      border-color: rgba(232, 176, 75, .35)
    }
    .badge-green {
      background: rgba(78, 201, 138, .14);
      color: var(--green);
      border-color: rgba(78, 201, 138, .32)
    }
    .badge-red {
      background: rgba(226, 86, 79, .14);
      color: #f19a95;
      border-color: rgba(226, 86, 79, .32)
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px
    }
    .field label {
      font-size: .76rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700
    }
    .input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 13px;
      border: 1px solid var(--stroke);
      background: rgba(0, 0, 0, .35);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 4px rgba(232, 176, 75, .13)
    }
    select.input {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
      background-size: 6px 6px;
      background-repeat: no-repeat
    }

    /* Navbar */
    .nav {
      position: sticky;
      top: 0;
      z-index: 80;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(8, 7, 11, .72);
      border-bottom: 1px solid var(--stroke);
    }
    .nav-in {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 72px
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--grad-gold);
      display: grid;
      place-items: center;
      color: #160e04;
      font-family: var(--display);
      font-size: 1.35rem;
      box-shadow: var(--shadow-gold);
    }
    .logo-txt {
      font-family: var(--display);
      font-size: 1.5rem;
      letter-spacing: .04em
    }
    .nav-links {
      display: flex;
      gap: 4px;
      margin-left: 14px
    }
    .nav-links a {
      padding: 9px 14px;
      border-radius: 999px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--muted);
      transition: color .2s, background .2s;
      cursor: pointer
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--surface-2)
    }
    .nav-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px
    }
    .burger {
      display: none;
      background: none;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--amber);
      cursor: pointer;
      background: var(--grad-dusk);
    }
    .avatar-fallback {
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: .85rem;
      color: var(--amber)
    }

    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      min-width: 230px;
      padding: 8px;
      z-index: 90;
    }
    .menu button {
      display: flex;
      width: 100%;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 11px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      text-align: left
    }
    .menu button:hover {
      background: var(--surface-2)
    }
    .menu .sep {
      height: 1px;
      background: var(--stroke);
      margin: 6px 4px
    }

    /* Toast */
    #toasts {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px
    }
    .toast {
      padding: 13px 17px;
      border-radius: 14px;
      min-width: 250px;
      max-width: 340px;
      font-size: .88rem;
      font-weight: 600;
      animation: slideIn .35s cubic-bezier(.2, .9, .25, 1);
    }
    .toast.ok {
      border-left: 3px solid var(--green)
    }
    .toast.err {
      border-left: 3px solid var(--red)
    }
    .toast.info {
      border-left: 3px solid var(--amber)
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(40px)
      }
      to {
        opacity: 1;
        transform: none
      }
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4, 3, 7, .76);
      backdrop-filter: blur(9px);
      animation: fadeIn .25s ease
    }
    @keyframes fadeIn {
      from {
        opacity: 0
      }
      to {
        opacity: 1
      }
    }
    .modal {
      width: min(620px, 100%);
      max-height: 88vh;
      overflow: auto;
      padding: 26px;
      animation: popIn .38s cubic-bezier(.2, .9, .25, 1);
      position: relative
    }
    .modal.wide {
      width: min(880px, 100%)
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.97)
      }
      to {
        opacity: 1;
        transform: none
      }
    }
    .modal-x {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--stroke);
      background: var(--surface-2);
      cursor: pointer;
      font-size: 1rem
    }
    .modal-x:hover {
      background: rgba(255, 255, 255, .14)
    }

    /* Loader */
    .loader-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      background: var(--grad-gold);
      z-index: 300;
      transition: width .3s ease, opacity .4s
    }
    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .14);
      border-top-color: var(--amber);
      animation: spin .7s linear infinite
    }
    @keyframes spin {
      to {
        transform: rotate(1turn)
      }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .12), rgba(255, 255, 255, .05));
      background-size: 200% 100%;
      animation: sh 1.2s infinite;
      border-radius: 12px
    }
    @keyframes sh {
      to {
        background-position: -200% 0
      }
    }

    /* Page transition */
    .page {
      animation: pageIn .45s cubic-bezier(.2, .8, .2, 1)
    }
    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(14px)
      }
      to {
        opacity: 1;
        transform: none
      }
    }

    /* Reveal on scroll */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1)
    }
    .reveal.in {
      opacity: 1;
      transform: none
    }

    /* Art (generated artwork placeholders) */
    .art {
      position: relative;
      overflow: hidden;
      background: var(--grad-dusk);
    }
    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(45% 60% at 25% 25%, var(--a1, rgba(232, 176, 75, .55)), transparent 65%),
        radial-gradient(55% 70% at 78% 70%, var(--a2, rgba(192, 86, 47, .6)), transparent 65%);
      filter: blur(6px)
    }
    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .5;
      background-image: repeating-linear-gradient(115deg, rgba(0, 0, 0, .35) 0 2px, transparent 2px 9px);
      mix-blend-mode: overlay
    }
    .art>* {
      position: relative;
      z-index: 2
    }
    .art-label {
      position: absolute;
      inset: auto 0 0 0;
      padding: 14px 16px;
      font-family: var(--display);
      font-size: 1.5rem;
      background: linear-gradient(transparent, rgba(4, 3, 6, .9))
    }

    /* Grids */
    .grid {
      display: grid;
      gap: 20px
    }
    .g3 {
      grid-template-columns: repeat(3, 1fr)
    }
    .g4 {
      grid-template-columns: repeat(4, 1fr)
    }
    .g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    /* Section */
    section.blk {
      padding: 86px 0
    }
    .sec-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 34px
    }
    .sec-head p {
      color: var(--muted);
      max-width: 56ch;
      margin-top: 8px
    }

    /* Hero */
    .hero {
      position: relative;
      padding: 96px 0 70px;
      overflow: hidden
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 44px;
      align-items: center
    }
    .hero h1 span {
      display: block
    }
    .hero p.lead {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 52ch;
      margin: 20px 0 28px
    }
    .stat-strip {
      display: flex;
      gap: 34px;
      margin-top: 44px;
      flex-wrap: wrap
    }
    .stat b {
      font-family: var(--display);
      font-size: 2.4rem;
      display: block;
      line-height: 1
    }
    .stat span {
      font-size: .74rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted)
    }
    .hero-card {
      padding: 22px;
      transform: rotate(1.2deg)
    }
    .ticket-stub {
      border-radius: 16px;
      padding: 18px;
      background: linear-gradient(150deg, rgba(232, 176, 75, .16), rgba(192, 86, 47, .12));
      border: 1px dashed rgba(232, 176, 75, .45);
      position: relative;
      overflow: hidden
    }
    .ticket-stub+.ticket-stub {
      margin-top: 12px
    }

    /* Search */
    .searchbox {
      position: relative;
      max-width: 560px
    }
    .searchbox .input {
      padding-left: 44px;
      height: 56px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .5)
    }
    .search-ico {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted)
    }
    .suggest {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 60;
      padding: 7px;
      max-height: 320px;
      overflow: auto
    }
    .suggest .item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer
    }
    .suggest .item:hover,
    .suggest .item.hl {
      background: var(--surface-2)
    }
    .suggest .thumb {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      flex: none
    }

    /* Artist page */
    .banner {
      height: 300px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      margin-top: 22px
    }
    .artist-head {
      display: flex;
      gap: 24px;
      align-items: flex-end;
      margin-top: -72px;
      padding: 0 26px;
      position: relative;
      z-index: 5
    }
    .artist-pic {
      width: 150px;
      height: 150px;
      border-radius: 26px;
      flex: none;
      border: 3px solid rgba(255, 255, 255, .25);
      box-shadow: var(--shadow)
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 7px;
      margin: 26px 0 30px;
      scrollbar-width: none
    }
    .tabs::-webkit-scrollbar {
      display: none
    }
    .tabs button {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 700;
      font-size: .88rem;
      color: var(--muted);
      white-space: nowrap;
      transition: .25s
    }
    .tabs button:hover {
      color: var(--text)
    }
    .tabs button.active {
      background: var(--grad-gold);
      color: #180f05
    }

    /* Event row */
    .event {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 20px;
      padding: 16px;
      align-items: center
    }
    .event .art {
      height: 104px;
      border-radius: 14px
    }
    .date-chip {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      flex: none;
      background: var(--surface-2);
      border: 1px solid var(--stroke);
      text-align: center;
      line-height: 1
    }
    .date-chip b {
      font-family: var(--display);
      font-size: 1.6rem;
      display: block
    }
    .date-chip span {
      font-size: .62rem;
      letter-spacing: .16em;
      color: var(--amber);
      text-transform: uppercase
    }

    /* Pricing / tiers */
    .tier {
      padding: 26px;
      position: relative;
      display: flex;
      flex-direction: column
    }
    .tier.featured {
      border-color: rgba(232, 176, 75, .5);
      box-shadow: var(--shadow-gold)
    }
    .tier .price {
      font-family: var(--display);
      font-size: 3rem;
      line-height: 1;
      margin: 14px 0 4px
    }
    .tier ul {
      list-style: none;
      margin: 18px 0 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1
    }
    .tier li {
      display: flex;
      gap: 10px;
      font-size: .9rem;
      color: #d9d4cb
    }
    .tier li::before {
      content: "✦";
      color: var(--amber)
    }
    .ribbon {
      position: absolute;
      top: 16px;
      right: 16px
    }

    /* Qty */
    .qty {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--stroke);

  <script>
    /* ============================================================
       ArtistTickets — Firebase Integration
       ============================================================ */

    // Firebase config (yours)
    const firebaseConfig = {
      apiKey: "AIzaSyDqnRzf-GJYwYIdfJ81KPVUQpdkErdFn4I",
      authDomain: "artisttickets-42807.firebaseapp.com",
      projectId: "artisttickets-42807",
      storageBucket: "artisttickets-42807.firebasestorage.app",
      messagingSenderId: "523932392914",
      appId: "1:523932392914:web:cdcd6a17d84edd9505bc0b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Enable offline persistence
    db.enablePersistence().catch(() => {});

    // ---------- Helpers ----------
    const money = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const compact = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
    const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) :
      '';
    const dayOf = d => new Date(d + 'T12:00:00').getDate();
    const monOf = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short' });
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [
      c]));
    const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const rand = n => Math.floor(Math.random() * n);
    const newId = () => 'ORD-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6)
      .toUpperCase();
    const newCode = () => 'AT' + Math.random().toString(36).slice(2, 12).toUpperCase();

    // Toast
    function toast(msg, kind = 'ok') {
      const el = document.createElement('div');
      el.className = 'toast glass ' + kind;
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0';
        el.style.transform = 'translateX(30px)';
        el.style.transition = '.4s';
        setTimeout(() => el.remove(), 400) }, 3400);
    }

    // Progress bar
    function progress() {
      const b = document.getElementById('loaderBar');
      b.style.opacity = '1';
      b.style.width = '18%';
      setTimeout(() => b.style.width = '72%', 90);
      setTimeout(() => { b.style.width = '100%';
        setTimeout(() => { b.style.opacity = '0';
          b.style.width = '0' }, 320) }, 280);
    }

    // QR generation (same as before, kept)
    function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619) } return h >>> 0 }

    function qrMatrix(text, size = 29) {
      const m = Array.from({ length: size }, () => Array(size).fill(0));
      let seed = hashStr(text) || 1;
      const next = () => { seed ^= seed << 13;
        seed >>>= 0;
        seed ^= seed >> 17;
        seed ^= seed << 5;
        seed >>>= 0; return seed / 4294967296 };
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++) m[y][x] = next() > .5 ? 1 : 0;
      const finder = (ox, oy) => {
        for (let y = 0; y < 7; y++)
          for (let x = 0; x < 7; x++) {
            const edge = x === 0 || y === 0 || x === 6 || y === 6;
            const core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
            m[oy + y][ox + x] = (edge || core) ? 1 : 0;
          }
        for (let y = -1; y < 8; y++)
          for (let x = -1; x < 8; x++) {
            const py = oy + y,
              px = ox + x;
            if (py >= 0 && px >= 0 && py < size && px < size && (y === -1 || x === -1 || y === 7 || x === 7)) m[py][px] =
              0;
          }
      };
      finder(0, 0);
      finder(size - 7, 0);
      finder(0, size - 7);
      for (let i = 8; i < size - 8; i++) { m[6][i] = i % 2 ? 0 : 1;
        m[i][6] = i % 2 ? 0 : 1 }
      const a = size - 9;
      for (let y = 0; y < 5; y++)
        for (let x = 0; x < 5; x++) {
          const edge = x === 0 || y === 0 || x === 4 || y === 4;
          m[a + y][a + x] = (edge || (x === 2 && y === 2)) ? 1 : 0;
        }
      return m;
    }

    function drawQR(canvas, text) {
      const size = 29,
        m = qrMatrix(text, size),
        px = canvas.width / size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0a0810';
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++)
          if (m[y][x]) ctx.fillRect(Math.round(x * px), Math.round(y * px), Math.ceil(px), Math.ceil(px));
    }

    function qrHTML(id) { return `<canvas class="qr" width="290" height="290" data-qr="${esc(id)}"></canvas>` }

    function paintQRs(scope) {
      (scope || document).querySelectorAll('canvas[data-qr]').forEach(c => drawQR(c, c.dataset.qr));
    }

    function downloadQR(code) {
      const c = document.createElement('canvas');
      c.width = 600;
      c.height = 600;
      drawQR(c, code);
      const a = document.createElement('a');
      a.download = code + '.png';
      a.href = c.toDataURL('image/png');
      a.click();
      toast('Pass downloaded as PNG', 'ok');
    }

    // Art helper
    function art(cls, a1, a2, label, style) {
      return `<div class="art ${cls||''}" style="${style||''};--a1:${a1};--a2:${a2}">${label?`<div class="art-label">${esc(label)}</div>`:''}</div>`;
    }

    function avatarHTML(u, size = 38) {
      if (u && u.photo) return `<img class="avatar" style="width:${size}px;height:${size}px" src="${u.photo}" alt="${esc(u.name)}">`;
      return `<div class="avatar avatar-fallback" style="width:${size}px;height:${size}px">${u?initials(u.name):'?'}</div>`;
    }

    // Modal
    function modal(html, wide) {
      const root = document.getElementById('modalRoot');
      root.innerHTML =
        `<div class="overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal glass ${wide?'wide':''}">
          <button class="modal-x" onclick="closeModal()">✕</button>${html}
        </div></div>`;
      paintQRs(root);
      document.body.style.overflow = 'hidden';
    }

    function closeModal() { document.getElementById('modalRoot').innerHTML = '';
      document.body.style.overflow = '' }

    // ---------- Global state ----------
    let currentUser = null; // Firebase user
    let currentUserData = null; // Firestore doc data
    let currentRole = 'customer'; // 'customer' or 'admin'
    let CART = null,
      payMethod = 'Credit Card';
    let artistTab = 'home',
      dashTab = null;
    let currentArtistId = null;
    let scanLog = [];
    let purchasesUnsubscribe = null;

    // ---------- Firebase Auth ----------
    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        // Fetch user document from Firestore
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          if (doc.exists) {
            currentUserData = doc.data();
            currentRole = currentUserData.role || 'customer';
          } else {
            // fallback: create a customer document if missing
            const newUser = {
              name: user.displayName || user.email || 'Fan',
              email: user.email,
              role: 'customer',
              joined: new Date().toISOString().slice(0, 10),
              spend: 0,
              photo: null,
              phone: ''
            };
            await db.collection('users').doc(user.uid).set(newUser);
            currentUserData = newUser;
            currentRole = 'customer';
          }
        } catch (e) {
          toast('Error loading profile', 'err');
          console.error(e);
        }
        renderAuth();
        // Route to dashboard or home depending on path
        if (location.hash === '#/dashboard') go('/dashboard');
        else route();
        // Set up real-time listener for admin if role is admin
        if (currentRole === 'admin') {
          if (purchasesUnsubscribe) purchasesUnsubscribe();
          purchasesUnsubscribe = db.collection('purchases').orderBy('date', 'desc').onSnapshot(snapshot => {
            // update admin dashboard if currently viewing admin dash
            if (dashTab && document.getElementById('dashBody')) {
              // re-render the current admin tab
              setDash(dashTab);
            }
          }, err => console.error(err));
        }
      } else {
        currentUser = null;
        currentUserData = null;
        currentRole = 'customer';
        if (purchasesUnsubscribe) { purchasesUnsubscribe();
          purchasesUnsubscribe = null; }
        renderAuth();
        // If on dashboard, redirect to home
        if (location.hash === '#/dashboard') go('/');
        route();
      }
    });

    async function confirmPay(total) {
      const btn = document.getElementById('payBtn');
      btn.disabled = true;
      btn.innerHTML =
      '<span class="spinner" style="width:18px;height:18px;border-width:2px"></span> Processing payment…';
      // Simulate async payment
      setTimeout(async () => {
        const rec = {
          ...CART,
          id: newId(),
          code: newCode(),
          userId: currentUser.uid,
          method: payMethod,
          date: new Date().toISOString().slice(0, 10),
          used: false,
          amount: total
        };
        // Save to Firestore
        try {
          await db.collection('purchases').add(rec);
          // Update user spend
          await db.collection('users').doc(currentUser.uid).update({
            spend: firebase.firestore.FieldValue.increment(total)
          });
          // Update event sold count if ticket
          if (rec.kind === 'ticket' && rec.eventId) {
            const evRef = db.collection('events').doc(rec.eventId);
            await evRef.update({
              sold: firebase.firestore.FieldValue.increment(rec.qty)
            });
          }
          // Add notification
          await db.collection('notifications').add({
            userId: currentUser.uid,
            title: 'Purchase confirmed',
            body: rec.label + ' — ' + rec.id,
            date: rec.date,
            read: false
          });
          showSuccess(rec);
        } catch (err) {
          toast('Payment failed: ' + err.message, 'err');
          btn.disabled = false;
          btn.textContent = 'Pay ' + money(total) + ' securely';
        }
      }, 1500);
    }

          from: currentUserData ? currentUserData.name : 'Anonymous',
          artistId,
          subject,
          body,
          date: new Date().toISOString().slice(0, 10),
          status: 'open',
          userId: currentUser.uid
        });
        closeModal();
        toast('Message delivered to the artist team', 'ok');

    function renderTicketModal() {

      const a = getArtistById(e.artistId);
      const t = e.tickets.find(x => x.type === ticketState.type);

      modal(`<div class="eyebrow">${esc(a? a.name:'')}</div>

    // Search
    function suggest(q) {
      const box = document.getElementById('suggestBox');
      if (!box) return;
      const list = cachedArtists.filter(a => a.name.toLowerCase().includes(q.trim().toLowerCase()) || a.genre.toLowerCase()
        .includes(q.trim().toLowerCase()));
      if (!q.trim() || !list.length) { box.classList.add('hidden'); if (q.trim() && !list.length) { box.classList.remove(
            'hidden');
          box.innerHTML = `<div class="item muted">No artist matches “${esc(q)}”</div>` } return }
      let sugIndex = -1;
      box.classList.remove('hidden');
      box.innerHTML = list.map((a, i) => `<div class="item" data-i="${i}" onclick="go('/artist/${a.id}')">
        ${art('thumb',a.c1,a.c2,'','')}
        <div><b style="font-size:.92rem">${esc(a.name)}</b><div class="muted" style="font-size:.78rem">${esc(a.genre)} · ${getEventsOfArtist(a.id).length} shows</div></div>
        <span class="badge" style="margin-left:auto">Open →</span></div>`).join('');
    }

    function searchKey(e) {
      const box = document.getElementById('suggestBox');
      if (!box || box.classList.contains('hidden')) { if (e.key === 'Enter') { doSearch(e.target.value) } return; }
      const items = [...box.querySelectorAll('.item[data-i]')];
      if (e.key === 'ArrowDown') { e.preventDefault();
        sugIndex = Math.min(items.length - 1, sugIndex + 1) } else if (e.key === 'ArrowUp') { e.preventDefault();
        sugIndex = Math.max(0, sugIndex - 1) } else if (e.key === 'Enter') { e.preventDefault(); if (items[sugIndex])
          items[sugIndex].click();
        else doSearch(e.target.value); return; } else return;
      items.forEach((it, i) => it.classList.toggle('hl', i === sugIndex));
    }
    let sugIndex = -1;

    function doSearch(q) {
      const a = cachedArtists.find(x => x.name.toLowerCase().includes(q.trim().toLowerCase()));
      if (a) go('/artist/' + a.id);
      else toast('No artist found for “' + q + '”', 'err');

    function kpi(label, value, delta) {

    function barChart(data, labels) {
      const max = Math.max(...data);
      return `<div class="chart">${data.map((d,i)=>`<div class="bar" style="height:${Math.round(d/max*100)}%;animation-delay:${i*45}ms">
        <b>${compact(d*1000)}</b><span>${labels[i]}</span></div>`).join('')}</div><div style="height:22px"></div>`;
    }

    function donut(parts) {
      const total = parts.reduce((s, p) => s + p.v, 0);
      let acc = 0;
      const stops = parts.map(p => { const a = acc / total * 360,
          b = (acc + p.v) / total * 360;
        acc += p.v; return `${p.c} ${a}deg ${b}deg` }).join(',');
      return `<div class="row gap-24" style="flex-wrap:wrap">
        <div class="donut" style="background:conic-gradient(${stops})"><div class="hole"><div>
          <div class="display" style="font-size:1.5rem">${compact(total)}</div><div class="muted" style="font-size:.64rem;letter-spacing:.16em">TOTAL</div></div></div></div>
        <div class="legend">${parts.map(p=>`<div><i style="background:${p.c}"></i>${esc(p.k)} — <b>${compact(p.v)}</b></div>`).join('')}</div></div>`;
    }

    async function resolveTicket(id) {
      // resolve ticket in firestore

      if (!doc.exists) return toast('Ticket not found', 'err');
      const data = doc.data();
      const newStatus = data.status === 'Resolved' ? 'Open' : 'Resolved';
      await db.collection('support').doc(id).update({ status: newStatus });
      toast('Ticket ' + id + ' updated', 'ok');
      setDash('Support Tickets');
    }

    // ---------- Router ----------
    async function route() {
      const path = (location.hash.replace(/^#/, '') || '/');
      const parts = path.split('/').filter(Boolean);
      let html;
      await loadCaches();
      if (parts.length === 0) html = await viewHome();
      else if (parts[0] === 'artists') html = await viewArtists();
      else if (parts[0] === 'events') html = await viewEvents();
      else if (parts[0] === 'memberships') html = await viewMemberships();
      else if (parts[0] === 'dashboard') html = await viewDashboard();
      else if (parts[0] === 'artist' && parts[1]) { currentArtistId = parts[1];
        artistTab = 'home';
        html = await viewArtist(parts[1]); } else html =
        `<div class="page wrap center" style="padding:90px 0"><h1>404</h1><p class="muted">That page does not exist.</p>
          <button class="btn btn-primary" style="margin-top:18px" onclick="go('/')">Back home</button></div>`;
      progress();
      app().innerHTML = html;
      window.scrollTo({ top: 0, behavior: 'instant' });
      paintQRs(app());
      observeReveals();
      animateCounts();
      markNav(path);
    }

    function go(path) {
      if (location.hash === '#' + path) { route(); } else { location.hash = path; }
      const mn = document.getElementById('mobileNav');
      if (mn) mn.classList.add('hidden');
    }

    function markNav(path) {
      document.querySelectorAll('#navLinks a').forEach(a => {
        const t = a.textContent.trim().toLowerCase();
        const map = { 'home': '/', 'artists': '/artists', 'events': '/events', 'memberships': '/memberships' };
        a.classList.toggle('active', map[t] === path);
      });
    }

    function toggleMobileNav() { document.getElementById('mobileNav').classList.toggle('hidden') }

    // Scroll reveal
    let io;

    function observeReveals() {
      if (io) io.disconnect();
      io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in');
          io.unobserve(x.target) } }), { threshold: .12 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    function animateCounts() {
      document.querySelectorAll('[data-count]').forEach(el => {
        const target = +el.dataset.count;
        const dur = 1400;
        const t0 = performance.now();
        const step = t => {
          const p = Math.min(1, (t - t0) / dur),
            e = 1 - Math.pow(1 - p, 3);
          el.textContent = target >= 1000 ? compact(Math.round(target * e)) : Math.round(target * e);
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    // ---------- Bootstrap ----------
    window.addEventListener('hashchange', route);
    // Initial route
    route();

    window.go = go;
    window.closeModal = closeModal;

    window.sendMessage = sendMessage;
    window.openContact = openContact;
    window.resolveTicket = resolveTicket;
    window.updatePhoto = updatePhoto;
    window.saveProfile = saveProfile;
    window.markAllRead = markAllRead;
    window.setPay = setPay;
    window.confirmPay = confirmPay;
    window.startCheckout = startCheckout;

    // Additional functions for profile
    function updatePhoto(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        await db.collection('users').doc(currentUser.uid).update({ photo: r.result });
        currentUserData.photo = r.result;
        setDash('Profile Settings');
        renderAuth();
        toast('Photo updated', 'ok');
      };
      r.readAsDataURL(f);
    }

    async function saveProfile() {
      const name = document.getElementById('pfName').value;
      const email = document.getElementById('pfEmail').value;
      const phone = document.getElementById('pfPhone').value;
      await db.collection('users').doc(currentUser.uid).update({ name, email, phone });
      currentUserData.name = name;
      currentUserData.email = email;
      currentUserData.phone = phone;
      renderAuth();
      toast('Profile saved', 'ok');
    }

    async function markAllRead() {
      const snapshot = await db.collection('notifications').where('userId', '==', currentUser.uid).get();
      const batch = db.batch();
      snapshot.docs.forEach(doc => batch.update(doc.ref, { read: true }));
      await batch.commit();
      setDash('Notifications');
      toast('All notifications marked read', 'ok');
    }
  </script>
